# Builds and tests blockclonia on every push and pull request.
#
#   linux     Ubuntu 26.04, gcc and clang, Release flags, -Werror, system
#             packages only; unit tests, --bench, and a 120-frame render on
#             Mesa lavapipe (software Vulkan) under Xvfb with validation.
#   old-vulkan-ubuntu, old-vulkan-debian
#             the build and tests against the oldest Vulkan headers the
#             code supports: 1.3.275 (Ubuntu 24.04, system packages) and
#             1.3.239 (Debian bookworm), so the VK_API_VERSION_1_4 guards
#             keep compiling.
#   sanitize  ASan + UBSan (gcc).
#   lint      tools/lint.sh: clang-tidy, cppcheck, shader checks, and
#             clang-format on the lines this change touches.
#   pi-arm64  native arm64 runner inside Debian trixie (the base of
#             Raspberry Pi OS trixie), tuned for the Pi 4; produces a .deb
#             that installs on 64-bit Pi OS.
#   pi-armhf  cross build for 32-bit Pi OS in Debian trixie, tests under
#             qemu-user; produces an armhf .deb.
#   macos     experimental: the game through MoltenVK (Homebrew) and the
#             unit tests on Apple Silicon, plus a best-effort render.
#   nightly   on pushes to main that pass, replaces the "nightly"
#             prerelease with the .debs.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v7
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build glslc libvulkan-dev libglfw3-dev libmimalloc-dev libsqlite3-dev libsodium-dev libenet-dev \
            mesa-vulkan-drivers vulkan-validationlayers xvfb xauth
      - run: cmake --preset ci-${{ matrix.compiler }}
      - run: cmake --build --preset ci-${{ matrix.compiler }}
      - run: ctest --preset ci-${{ matrix.compiler }}

  old-vulkan-ubuntu:
    runs-on: ubuntu-24.04 # Vulkan headers 1.3.275, GLFW 3.3, mimalloc 2.1
    steps:
      - uses: actions/checkout@v7
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build glslc libvulkan-dev libglfw3-dev libmimalloc-dev libsqlite3-dev libsodium-dev libenet-dev \
            mesa-vulkan-drivers vulkan-validationlayers xvfb xauth
      - run: cmake --preset ci-gcc
      - run: cmake --build --preset ci-gcc
      - run: ctest --preset ci-gcc

  old-vulkan-debian:
    runs-on: ubuntu-26.04
    container: debian:bookworm # Vulkan headers 1.3.239
    steps:
      - uses: actions/checkout@v7
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ca-certificates glslc \
            libvulkan-dev libsqlite3-dev libsodium-dev pkg-config \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libwayland-bin libxkbcommon-dev \
            mesa-vulkan-drivers vulkan-validationlayers xvfb xauth
      # bookworm's mimalloc 2.0 is too old even for MC_DEPS=SYSTEM, so AUTO
      # builds the pinned mimalloc and GLFW from source, as pi-arm64 does.
      - run: cmake --preset release -DMC_DEPS=AUTO -DMC_WERROR=ON
      - run: cmake --build --preset release
      - run: ctest --preset release

  sanitize:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build glslc libvulkan-dev libglfw3-dev libmimalloc-dev libsqlite3-dev libsodium-dev \
            mesa-vulkan-drivers vulkan-validationlayers xvfb xauth \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libwayland-bin libxkbcommon-dev
      # Ubuntu's GLFW 3.4 and mimalloc 3.2 are older than the pinned
      # releases, so the preset's MC_DEPS=AUTO builds both from source
      # (GLFW needs the X11 and Wayland headers and wayland-scanner).
      - run: cmake --preset asan -DMC_WERROR=ON
      - run: cmake --build --preset asan
      - run: ctest --preset asan

  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # clang-format checks only lines changed since the base
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build glslc glslang-tools libvulkan-dev libglfw3-dev libmimalloc-dev libsqlite3-dev libsodium-dev \
            clang clang-tidy clang-format cppcheck \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libwayland-bin libxkbcommon-dev # GLFW from source, as in sanitize
      - name: tools/lint.sh
        env:
          MC_FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A new branch's first push has no "before" commit.
          if ! git cat-file -e "${MC_FORMAT_BASE}^{commit}" 2>/dev/null; then MC_FORMAT_BASE=HEAD~1; fi
          export MC_FORMAT_BASE
          tools/lint.sh

  pi-arm64:
    runs-on: ubuntu-26.04-arm # GitHub-hosted arm64; free for public repositories
    container: debian:trixie
    steps:
      - uses: actions/checkout@v7
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ca-certificates glslc file \
            libvulkan-dev libsqlite3-dev libsodium-dev pkg-config \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libwayland-bin libxkbcommon-dev \
            mesa-vulkan-drivers vulkan-validationlayers xvfb xauth
      # trixie ships mimalloc 3.0.x and GLFW 3.4, both older than the
      # pinned 3.5 series, so MC_DEPS=AUTO builds mimalloc 3.5.3 and GLFW
      # 3.5.1 from source here (GLFW needs the X11 and Wayland headers).
      - run: cmake --preset release -DMC_CPU=pi4 -DMC_DEPS=AUTO -DMC_WERROR=ON
      - run: cmake --build --preset release
      - run: ctest --preset release
      - run: cd build/release && cpack -G DEB
      - uses: actions/upload-artifact@v7
        with:
          name: blockclonia-pi-arm64
          path: build/release/*.deb

  pi-armhf:
    runs-on: ubuntu-26.04
    container: debian:trixie
    steps:
      - uses: actions/checkout@v7
      - name: Install packages
        run: |
          dpkg --add-architecture armhf
          apt-get update
          apt-get install -y --no-install-recommends \
            cmake ninja-build ca-certificates glslc qemu-user \
            crossbuild-essential-armhf \
            libvulkan-dev:armhf libsqlite3-dev:armhf libsodium-dev:armhf pkg-config libwayland-bin \
            libx11-dev:armhf libxrandr-dev:armhf libxinerama-dev:armhf \
            libxcursor-dev:armhf libxi-dev:armhf \
            libwayland-dev:armhf libxkbcommon-dev:armhf
      - run: cmake --preset pi4-armhf -DMC_DEPS=AUTO -DMC_WERROR=ON
      - run: cmake --build --preset pi4-armhf
      - run: ctest --preset pi4-armhf # unit + bench under qemu-arm
      - run: cd build/pi4-armhf && cpack -G DEB
      - uses: actions/upload-artifact@v7
        with:
          name: blockclonia-pi-armhf
          path: build/pi4-armhf/*.deb

  macos:
    runs-on: macos-26
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - run: brew install ninja libsodium mimalloc glfw vulkan-headers vulkan-loader molten-vk shaderc vulkan-validationlayers
      - run: cmake --preset macos -DCMAKE_PREFIX_PATH="$(brew --prefix)"
      - run: cmake --build --preset macos
      - run: ctest --test-dir build/macos --output-on-failure
      # Nobody on the project has a Mac, so this log is how a renderer bug
      # on MoltenVK shows up: validation messages, MoltenVK's own warnings
      # and, on a crash, lldb's backtrace, with all optional features, with
      # host image copy off and with none. Hosted runners are VMs (Apple's
      # paravirtual GPU), so a failure here does not fail the job.
      - name: Render 60 frames through MoltenVK
        continue-on-error: true
        env:
          MVK_CONFIG_LOG_LEVEL: 2
        run: |
          rc=0
          mkdir -p shots
          # Each run holds something, so the screenshots show the view model:
          # a solid block and an item card (it has transparent texels).
          for run in default:log default:stick hostcopy:stick all:stick; do
            off=${run%%:*} held=${run#*:}
            [ "$off" = default ] && off=
            echo "== MC_VK_DISABLE=$off holding $held"
            MC_VK_DISABLE=$off lldb --batch -o run -k 'bt 30' -k 'quit 1' -- \
              ./build/macos/blockclonia --validate --no-sound --no-save --seed 1337 --play --frames 60 \
              --give "$held:1" --screenshot "shots/${run/:/-}.ppm" || rc=1
          done
          exit $rc
      - name: Upload the macOS screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-screenshots
          path: shots/
          if-no-files-found: ignore

  # Every push to main that passes the jobs below replaces the "nightly"
  # prerelease (and its tag) with the packages built from that commit.
  nightly:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [linux, sanitize, lint, pi-arm64, pi-armhf]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    concurrency:
      group: nightly-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: blockclonia-*
          path: dist
          merge-multiple: true
      - name: Publish the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly dist/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Nightly ($(date -u +%Y-%m-%d), ${GITHUB_SHA::7})" \
            --notes "Automated build of ${GITHUB_SHA} from main. Not a stable release."
