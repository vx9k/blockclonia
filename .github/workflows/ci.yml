# Builds, tests and releases blockclonia.
#
#   linux     Ubuntu 26.04, gcc and clang, Release flags, -Werror, system
#             packages only; unit tests, --bench, and a 120-frame render on
#             Mesa lavapipe (software Vulkan) under Xvfb with validation.
#   old-vulkan-ubuntu, old-vulkan-debian
#             the build and tests against the oldest Vulkan headers the
#             code supports: 1.3.275 (Ubuntu 24.04, system packages) and
#             1.3.239 (Debian bookworm), so the VK_API_VERSION_1_4 guards
#             keep compiling.
#   sanitize  ASan + UBSan (gcc).
#   lint      tools/lint.sh: clang-tidy, cppcheck, shader checks, and
#             clang-format on the lines this change touches; and the tests
#             of the CI and release tools.
#   package   the Raspberry Pi .debs (package.yml).
#   macos     experimental: the game through MoltenVK (Homebrew) and the
#             unit tests on Apple Silicon, plus a best-effort render.
#   ci-passed the one check the ruleset requires; it stands for the rest.
#   nightly   on pushes to main that pass, publishes the .debs as a
#             nightly-<date>-<commit> prerelease and prunes the older ones.
#   release   weekly: versions, tags and publishes the checked main
#             revision (tools/release.sh), with release-package and
#             release-publish building and attesting its .debs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The weekly release: CI checks main's head, then the release job publishes
  # it. Pushes release at once only for a security fix (`fix(security): …`)
  # or to catch up a missed week; see due() in tools/release.py.
  schedule:
    - cron: "0 6 * * 1"
  # A release by hand, e.g. when the weekly run lost a race to a merge.
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Each push to main gets
# its own group, so main's runs neither queue nor get cancelled; the event
# keeps the weekly run apart from its commit's push run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing here pushes: keep the token out of .git/config.
          persist-credentials: false
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build glslc libvulkan-dev libglfw3-dev libmimalloc-dev libsqlite3-dev libsodium-dev libenet-dev libminiupnpc-dev \
            mesa-vulkan-drivers vulkan-validationlayers xvfb xauth
      - run: cmake --preset ci-${{ matrix.compiler }}
      - run: cmake --build --preset ci-${{ matrix.compiler }}
      - run: ctest --preset ci-${{ matrix.compiler }}

  old-vulkan-ubuntu:
    runs-on: ubuntu-24.04 # Vulkan headers 1.3.275, GLFW 3.3, mimalloc 2.1
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing here pushes: keep the token out of .git/config.
          persist-credentials: false
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build glslc libvulkan-dev libglfw3-dev libmimalloc-dev libsqlite3-dev libsodium-dev libenet-dev libminiupnpc-dev \
            mesa-vulkan-drivers vulkan-validationlayers xvfb xauth
      - run: cmake --preset ci-gcc
      - run: cmake --build --preset ci-gcc
      - run: ctest --preset ci-gcc

  old-vulkan-debian:
    runs-on: ubuntu-26.04
    container: debian:bookworm # Vulkan headers 1.3.239
    # mimalloc and GLFW build from source before the game.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing here pushes: keep the token out of .git/config.
          persist-credentials: false
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ca-certificates glslc \
            libvulkan-dev libsqlite3-dev libsodium-dev pkg-config \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libwayland-bin libxkbcommon-dev \
            mesa-vulkan-drivers vulkan-validationlayers xvfb xauth
      # bookworm's mimalloc 2.0 is too old even for MC_DEPS=SYSTEM, so AUTO
      # builds the pinned mimalloc and GLFW from source, as pi-arm64 does.
      - run: cmake --preset release -DMC_DEPS=AUTO -DMC_WERROR=ON
      - run: cmake --build --preset release
      - run: ctest --preset release

  sanitize:
    runs-on: ubuntu-26.04
    # Instrumented tests run a few times slower; GLFW and mimalloc build too.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing here pushes: keep the token out of .git/config.
          persist-credentials: false
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build glslc libvulkan-dev libglfw3-dev libmimalloc-dev libsqlite3-dev libsodium-dev \
            mesa-vulkan-drivers vulkan-validationlayers xvfb xauth \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libwayland-bin libxkbcommon-dev
      # Ubuntu's GLFW 3.4 and mimalloc 3.2 are older than the pinned
      # releases, so the preset's MC_DEPS=AUTO builds both from source
      # (GLFW needs the X11 and Wayland headers and wayland-scanner).
      - run: cmake --preset asan -DMC_WERROR=ON
      - run: cmake --build --preset asan
      - run: ctest --preset asan

  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing here pushes: keep the token out of .git/config.
          persist-credentials: false
          fetch-depth: 0 # clang-format checks only lines changed since the base
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build glslc glslang-tools libvulkan-dev libglfw3-dev libmimalloc-dev libsqlite3-dev libsodium-dev \
            clang clang-tidy clang-format cppcheck \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libwayland-bin libxkbcommon-dev # GLFW from source, as in sanitize
      - name: tools/lint.sh
        env:
          MC_FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A new branch's first push, and the weekly and manual runs, have
          # no "before" commit.
          if ! git cat-file -e "${MC_FORMAT_BASE}^{commit}" 2>/dev/null; then MC_FORMAT_BASE=HEAD~1; fi
          export MC_FORMAT_BASE
          tools/lint.sh

  package:
    uses: ./.github/workflows/package.yml

  macos:
    runs-on: macos-26
    # Experimental: a failure here neither fails the run nor blocks a merge,
    # so ci-passed does not wait for it.
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing here pushes: keep the token out of .git/config.
          persist-credentials: false
      - run: brew install ninja libsodium mimalloc glfw vulkan-headers vulkan-loader molten-vk shaderc vulkan-validationlayers
      - run: cmake --preset macos -DCMAKE_PREFIX_PATH="$(brew --prefix)"
      - run: cmake --build --preset macos
      - run: ctest --test-dir build/macos --output-on-failure
      # Nobody on the project has a Mac, so this log is how a renderer bug
      # on MoltenVK shows up: validation messages, MoltenVK's own warnings
      # and, on a crash, lldb's backtrace, with all optional features, with
      # host image copy off and with none. Hosted runners are VMs (Apple's
      # paravirtual GPU), so a failure here does not fail the job.
      - name: Render 60 frames through MoltenVK
        continue-on-error: true
        env:
          MVK_CONFIG_LOG_LEVEL: 2
        run: |
          rc=0
          mkdir -p shots
          # Each run holds something, so the screenshots show the view model:
          # a solid block and an item card (it has transparent texels).
          for run in default:log default:stick hostcopy:stick all:stick; do
            off=${run%%:*} held=${run#*:}
            [ "$off" = default ] && off=
            echo "== MC_VK_DISABLE=$off holding $held"
            MC_VK_DISABLE=$off lldb --batch -o run -k 'bt 30' -k 'quit 1' -- \
              ./build/macos/blockclonia --validate --no-sound --no-save --seed 1337 --play --frames 60 \
              --give "$held:1" --screenshot "shots/${run/:/-}.ppm" || rc=1
          done
          exit $rc
      - name: Upload the macOS screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-screenshots
          path: shots/
          if-no-files-found: ignore

  # The one check the ruleset needs from this workflow: it fails unless every
  # job above succeeded (macos aside), so a new job is required as soon as it
  # is listed here, and a skipped or cancelled one cannot pass for green.
  ci-passed:
    name: CI passed
    needs: [linux, old-vulkan-ubuntu, old-vulkan-debian, sanitize, lint, package]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done

  # Every push to main that passes publishes its packages as a prerelease
  # and then deletes the older nightlies. Each gets a tag of its own: with
  # immutable releases on, GitHub never lets a tag name be used again once
  # a release published it, so one moving "nightly" tag fails from the
  # second push on.
  nightly:
    needs: [ci-passed]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: nightly-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: blockclonia-*
          path: dist
          merge-multiple: true
      - name: Publish the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="nightly-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          # A rerun finds its release already published and only prunes.
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" dist/* \
              --target "$GITHUB_SHA" \
              --prerelease \
              --latest=false \
              --title "Nightly ($(date -u +%Y-%m-%d), ${GITHUB_SHA::7})" \
              --notes "Automated build of ${GITHUB_SHA} from main. Not a stable release."
          fi
          # Publish before pruning so a nightly is always there. An immutable
          # release's tag cannot be deleted, so a failed tag cleanup only warns.
          gh release list --limit 100 --json tagName --jq '.[].tagName' |
            grep -E '^nightly(-|$)' | grep -vxF "$tag" |
            while read -r old; do
              gh release delete "$old" --cleanup-tag --yes ||
                echo "::warning::could not fully delete $old"
            done

  # Versions and tags the checked revision when a release is due; its output
  # `version` is empty when none is.
  release:
    needs: [ci-passed]
    # release.sh decides whether this run releases: weekly, or a push with a
    # security fix or after a missed week.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: blockclonia-release
      cancel-in-progress: false
    outputs:
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # main is protected; this write deploy key is the ruleset's only
          # bypass, so the release commit can land there.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - name: Version and tag the checked main revision
        id: prepare
        run: bash tools/release.sh prepare

  # The release's own .debs, built from its tag so they carry its version.
  release-package:
    needs: [release]
    if: needs.release.outputs.version != ''
    uses: ./.github/workflows/package.yml
    with:
      release: ${{ needs.release.outputs.version }}
      artifact-prefix: release

  release-publish:
    needs: [release, release-package]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      # Sigstore signing of the packages' build provenance.
      id-token: write
      attestations: write
    concurrency:
      group: blockclonia-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}
          # Nothing here pushes: keep the token out of .git/config.
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      # Signs which run and commit built the packages; verify a download with
      # `gh attestation verify <file> --repo vx9k/blockclonia`.
      - name: Attest the release packages
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/blockclonia_*.deb
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.release.outputs.version }}
        run: bash tools/release.sh publish
