# Builds and tests blockclonia on every push and pull request.
#
#   linux     Ubuntu 26.04, gcc and clang, Release flags, -Werror, system
#             packages only; unit tests, --bench, and a 120-frame render on
#             Mesa lavapipe (software Vulkan) under Xvfb with validation.
#   sanitize  ASan + UBSan (gcc).
#   lint      tools/lint.sh: clang-tidy, cppcheck, shader checks, and
#             clang-format on the lines this change touches.
#   pi-arm64  native arm64 runner inside Debian trixie (the base of
#             Raspberry Pi OS trixie), tuned for the Pi 4; produces a .deb
#             that installs on 64-bit Pi OS.
#   pi-armhf  cross build for 32-bit Pi OS in Debian trixie, tests under
#             qemu-user; produces an armhf .deb.
#   macos     experimental: core + unit tests (the renderer still needs the
#             MoltenVK portability changes described in the build audit).
#   nightly   on pushes to main that pass, replaces the "nightly"
#             prerelease with the .debs.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v7
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build glslc libvulkan-dev libglfw3-dev libmimalloc-dev libsqlite3-dev \
            mesa-vulkan-drivers vulkan-validationlayers xvfb xauth
      - run: cmake --preset ci-${{ matrix.compiler }}
      - run: cmake --build --preset ci-${{ matrix.compiler }}
      - run: ctest --preset ci-${{ matrix.compiler }}

  sanitize:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build glslc libvulkan-dev libglfw3-dev libmimalloc-dev libsqlite3-dev \
            mesa-vulkan-drivers vulkan-validationlayers xvfb xauth \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libwayland-bin libxkbcommon-dev
      # Ubuntu's GLFW 3.4 and mimalloc 3.2 are older than the pinned
      # releases, so the preset's MC_DEPS=AUTO builds both from source
      # (GLFW needs the X11 and Wayland headers and wayland-scanner).
      - run: cmake --preset asan -DMC_WERROR=ON
      - run: cmake --build --preset asan
      - run: ctest --preset asan

  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # clang-format checks only lines changed since the base
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build glslc glslang-tools libvulkan-dev libglfw3-dev libmimalloc-dev libsqlite3-dev \
            clang clang-tidy clang-format cppcheck \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libwayland-bin libxkbcommon-dev # GLFW from source, as in sanitize
      - name: tools/lint.sh
        env:
          MC_FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A new branch's first push has no "before" commit.
          if ! git cat-file -e "${MC_FORMAT_BASE}^{commit}" 2>/dev/null; then MC_FORMAT_BASE=HEAD~1; fi
          export MC_FORMAT_BASE
          tools/lint.sh

  pi-arm64:
    runs-on: ubuntu-26.04-arm # GitHub-hosted arm64; free for public repositories
    container: debian:trixie
    steps:
      - uses: actions/checkout@v7
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ca-certificates glslc file \
            libvulkan-dev libsqlite3-dev pkg-config \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libwayland-bin libxkbcommon-dev \
            mesa-vulkan-drivers vulkan-validationlayers xvfb xauth
      # trixie ships mimalloc 3.0.x and GLFW 3.4, both older than the
      # pinned 3.5 series, so MC_DEPS=AUTO builds mimalloc 3.5.3 and GLFW
      # 3.5.1 from source here (GLFW needs the X11 and Wayland headers).
      - run: cmake --preset release -DMC_CPU=pi4 -DMC_DEPS=AUTO -DMC_WERROR=ON
      - run: cmake --build --preset release
      - run: ctest --preset release
      - run: cd build/release && cpack -G DEB
      - uses: actions/upload-artifact@v7
        with:
          name: blockclonia-pi-arm64
          path: build/release/*.deb

  pi-armhf:
    runs-on: ubuntu-26.04
    container: debian:trixie
    steps:
      - uses: actions/checkout@v7
      - name: Install packages
        run: |
          dpkg --add-architecture armhf
          apt-get update
          apt-get install -y --no-install-recommends \
            cmake ninja-build ca-certificates glslc qemu-user \
            crossbuild-essential-armhf \
            libvulkan-dev:armhf libsqlite3-dev:armhf pkg-config libwayland-bin \
            libx11-dev:armhf libxrandr-dev:armhf libxinerama-dev:armhf \
            libxcursor-dev:armhf libxi-dev:armhf \
            libwayland-dev:armhf libxkbcommon-dev:armhf
      - run: cmake --preset pi4-armhf -DMC_DEPS=AUTO -DMC_WERROR=ON
      - run: cmake --build --preset pi4-armhf
      - run: ctest --preset pi4-armhf # unit + bench under qemu-arm
      - run: cd build/pi4-armhf && cpack -G DEB
      - uses: actions/upload-artifact@v7
        with:
          name: blockclonia-pi-armhf
          path: build/pi4-armhf/*.deb

  macos:
    runs-on: macos-26
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - run: brew install ninja mimalloc
      - run: cmake --preset core -DCMAKE_PREFIX_PATH="$(brew --prefix)" -DMC_DEPS=AUTO
      - run: cmake --build --preset core
      - run: ctest --preset core

  # Every push to main that passes the jobs below replaces the "nightly"
  # prerelease (and its tag) with the packages built from that commit.
  nightly:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [linux, sanitize, lint, pi-arm64, pi-armhf]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    concurrency:
      group: nightly-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: blockclonia-*
          path: dist
          merge-multiple: true
      - name: Publish the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly dist/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Nightly ($(date -u +%Y-%m-%d), ${GITHUB_SHA::7})" \
            --notes "Automated build of ${GITHUB_SHA} from main. Not a stable release."
