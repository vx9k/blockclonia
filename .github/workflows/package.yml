# Builds, tests and packages blockclonia for every supported Linux. ci.yml
# calls it twice: for every run, from the commit under test (versioned
# "+git.<date>.<sha>", feeding the nightly), and for a release, from its tag
# (the plain version).
#
#   ubuntu  Ubuntu 26.04 on x86_64 and arm64, native runners: Release flags
#           with ThinLTO, PGO and BOLT, -Werror, system packages only; unit
#           tests, --bench and a lavapipe render under Xvfb with validation,
#           all on the optimised binary; a .deb per architecture.
#   alpine  Alpine Linux (musl) on x86_64 and arm64, in a container started
#           with docker run (GitHub's JavaScript actions don't run inside an
#           Alpine arm64 container); PGO without BOLT, which Alpine doesn't
#           package; the same tests; a tarball per architecture.
name: Linux packages

on:
  workflow_call:
    inputs:
      release:
        description: The release version whose tag (v<version>) to build; empty builds the commit under test.
        type: string
        default: ""
      artifact-prefix:
        description: Prefix of the uploaded artifacts' names.
        type: string
        default: blockclonia

permissions:
  contents: read

jobs:
  ubuntu:
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86-64-v2 (SSE4.2, 2009 on) runs on every CPU that drives a
          # Vulkan 1.2 GPU; arm64 keeps the compiler's ARMv8.0 default.
          - { arch: amd64, runner: ubuntu-26.04, cpu: x86-64-v2 }
          - { arch: arm64, runner: ubuntu-26.04-arm, cpu: "" }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # Only a release tag or the commit under test, never a ref a caller
          # names: this workflow builds what it is given.
          ref: ${{ inputs.release != '' && format('refs/tags/v{0}', inputs.release) || '' }}
          # Nothing here pushes: keep the token out of .git/config.
          persist-credentials: false
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm dpkg-dev \
            ninja-build glslc libvulkan-dev libglfw3-dev libmimalloc-dev libsqlite3-dev libsodium-dev libenet-dev libminiupnpc-dev zlib1g-dev \
            mesa-vulkan-drivers vulkan-validationlayers xvfb xauth
          # dpkg-dev is for dpkg-shlibdeps, which writes the package's exact
          # Depends: from the binary.
          # BOLT and clang's profile runtime (for PGO) come per LLVM version
          # (bolt-21 and libclang-rt-21-dev for clang 21).
          v=$(clang --version | sed -n 's/.*clang version \([0-9]*\).*/\1/p' | head -n 1)
          sudo apt-get install -y --no-install-recommends "bolt-$v" "libclang-rt-$v-dev"
      - name: Version the package
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          # A release keeps its plain version; anything else names its commit.
          if [ -z "$RELEASE" ]; then
            echo "MC_PACKAGE_VERSION_SUFFIX=+git.$(date -u +%Y%m%d).$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_ENV"
          fi
      # ON: a package without PGO or BOLT fails the build instead of shipping.
      - run: cmake --preset ci -DMC_CPU="${{ matrix.cpu }}" -DMC_PGO=ON -DMC_BOLT=ON -DMC_PACKAGE_VERSION_SUFFIX="${MC_PACKAGE_VERSION_SUFFIX:-}"
      - run: cmake --build --preset ci
      - run: ctest --preset ci
      - run: cd build/ci && cpack -G DEB
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}-ubuntu-${{ matrix.arch }}
          path: build/ci/*.deb
          if-no-files-found: error
          retention-days: 14

  alpine:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-26.04, cpu: x86-64-v2 }
          - { arch: aarch64, runner: ubuntu-26.04-arm, cpu: "" }
    runs-on: ${{ matrix.runner }}
    # mimalloc and GLFW build from source before the game.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # Only a release tag or the commit under test, never a ref a caller
          # names: this workflow builds what it is given.
          ref: ${{ inputs.release != '' && format('refs/tags/v{0}', inputs.release) || '' }}
          # Nothing here pushes: keep the token out of .git/config.
          persist-credentials: false
      - name: Version the package
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          # A release keeps its plain version; anything else names its commit.
          if [ -z "$RELEASE" ]; then
            echo "MC_PACKAGE_VERSION_SUFFIX=+git.$(date -u +%Y%m%d).$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_ENV"
          fi
      # Alpine's mimalloc 2.2 and GLFW 3.4 are older than the pinned 3.5
      # series, so MC_DEPS=AUTO builds both from source (GLFW needs the X11
      # and Wayland headers). The container runs as root on the checkout, so
      # git is told the mounted tree is safe.
      - name: Build, test and package in Alpine 3.24
        env:
          MC_CPU: ${{ matrix.cpu }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            -e MC_CPU -e MC_PACKAGE_VERSION_SUFFIX="${MC_PACKAGE_VERSION_SUFFIX:-}" \
            alpine:3.24 sh -euxc '
              apk add --no-cache \
                clang22 lld22 llvm compiler-rt musl-dev linux-headers cmake samurai pkgconf git ca-certificates \
                shaderc vulkan-loader-dev vulkan-headers sqlite-dev libsodium-dev enet-dev miniupnpc-dev zlib-ng-dev \
                libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev wayland-dev libxkbcommon-dev \
                mesa-vulkan-swrast vulkan-validation-layers xvfb-run xauth
              git config --global --add safe.directory /src
              cmake --preset release -DMC_DEPS=AUTO -DMC_WERROR=ON -DMC_CPU="$MC_CPU" -DMC_PGO=ON -DMC_BOLT=OFF \
                -DMC_PACKAGE_VERSION_SUFFIX="$MC_PACKAGE_VERSION_SUFFIX"
              cmake --build --preset release
              ctest --preset release
              cd build/release && cpack -G TGZ'
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}-alpine-${{ matrix.arch }}
          path: build/release/*.tar.gz
          if-no-files-found: error
          retention-days: 14
